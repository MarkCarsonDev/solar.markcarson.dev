{% set why_solar = all_blog_posts | selectattr('slug', 'equalto', 'why-solar') | first %}
<header id="banner">
    <div id="stamp">
        <a href="/">markcarson.dev</a>
        <span id="battery-status" data-tip="charging status and battery level coming soon">{% if battery_charging %}☀ solarized{% else %}⬡ {{ battery_level }}%{% endif %}</span>
    </div>
    <div id="message">
        <p>This site is solar-powered and may go down occasionally. <a href="{{ why_solar.full_url if why_solar else '/blog/' }}">Read why.</a></p>
    </div>
    <div id="items">
        <div class="theme-switch-wrapper">
            <button type="button" class="theme-switch keypress keypress-reverse" id="kpD"
                    aria-label="Dark mode" aria-pressed="false" title="Toggle dark mode (D)">
                <span class="keycap" aria-hidden="true">D</span>
                <span id="theme-icon" class="theme-icon" aria-hidden="true"></span>
            </button>
        </div>
        <a href="/feed.xml" class="rss-link keypress keypress-reverse" title="RSS Feed" aria-label="RSS Feed">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="6.18" cy="17.82" r="2.18"/>
                <path d="M4 4.44v2.83c7.03 0 12.73 5.7 12.73 12.73h2.83c0-8.59-6.97-15.56-15.56-15.56zm0 5.66v2.83c3.9 0 7.07 3.17 7.07 7.07h2.83c0-5.47-4.43-9.9-9.9-9.9z"/>
            </svg>
        </a>
    </div>
</header>
